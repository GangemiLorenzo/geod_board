name: Polygon snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch Polygon wallet history
        env:
          POLYGON_WALLET: '0xB248DBe3be3Ab0Cc8D6dc0FeF836502d62c1fD95'
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: node scripts/fetch-polygon-history.mjs
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/polygon-history.json
          git diff --cached --quiet || git commit -m "data: update Polygon wallet snapshot"
          git push
