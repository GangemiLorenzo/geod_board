<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEOD Mining Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="grid-bg"></div>
    
    <header class="header">
        <div class="header-left">
            <span class="logo">⛏</span>
            <h1 class="title">GEOD MINING DASHBOARD</h1>
        </div>
        <div class="header-right">
            <span class="status-indicator" id="status-indicator">
                <span class="status-dot"></span>
                <span class="status-text">LOADING</span>
            </span>
            <span class="last-update" id="last-update">--:--:--</span>
        </div>
    </header>

    <main class="main">
        <section class="stats-row two-col">
            <div class="card">
                <div class="card-label">GEOD PRICE</div>
                <div class="card-value" id="geod-price">--</div>
                <div class="card-change" id="geod-change">--</div>
            </div>
            <div class="card">
                <div class="card-label">PORTFOLIO VALUE</div>
                <div class="card-value highlight" id="portfolio-value">--</div>
                <div class="card-sub" id="geod-balance">-- GEOD</div>
            </div>
        </section>

        <section class="chart-section combined-chart">
            <div class="section-header">
                <h2 class="section-title">GEOD OVERVIEW</h2>
                <div class="timeframe-buttons">
                    <button class="tf-btn-cb" data-days="30">1M</button>
                    <button class="tf-btn-cb active" data-days="90">3M</button>
                    <button class="tf-btn-cb" data-days="180">6M</button>
                    <button class="tf-btn-cb" data-days="365">1Y</button>
                </div>
            </div>
            <div class="legend-container" id="chart-legend"></div>
            <div class="chart-container chart-large">
                <div class="chart-loading" id="combined-chart-loading">Loading...</div>
                <canvas id="combined-chart"></canvas>
            </div>
            <div class="tx-summary" id="combined-summary"></div>
        </section>

        <section class="miners-section">
            <div class="section-header">
                <h2 class="section-title">MINERS</h2>
                <span class="miners-note">Status available on GEODNET Console</span>
            </div>
            <div class="miners-grid">
                <div class="miner-card">
                    <div class="miner-id">E831CD2AC355</div>
                    <div class="miner-location">📍 Italy</div>
                </div>
                <div class="miner-card">
                    <div class="miner-id">E831CD30C3BD</div>
                    <div class="miner-location">📍 Italy</div>
                </div>
            </div>
            <a href="https://console.geodnet.com/mine" target="_blank" class="console-link">
                → VIEW ON GEODNET CONSOLE
            </a>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-left">
            Wallet: <span class="wallet-addr" id="wallet-display">--</span>
        </div>
        <div class="footer-right">
            Auto-refresh: 60s
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
